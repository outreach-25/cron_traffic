name: Scheduled GET Request # Name of the workflow

on:
  schedule:
    - cron: '*/4 * * * *' # Runs every 4 minutes

jobs:
  send_request: # Name of the job
    runs-on: ubuntu-latest # Specifies the type of machine to run on
    steps:
      - name: Send GET Request # Name of the step
        run: |
          curl "https://cron-project-1.onrender.com/"
